<!DOCTYPE html>
<html lang="en">
    <HEAD>
      <script src="https://cdn.jsdelivr.net/gh/fsvdonets/oidtest@refs/heads/master/public/javascripts/openidconnect.js">
      </script>

        <script>
            OIDC.restoreInfo();
            var id_token = OIDC.getValidIdToken();
            var access_token = OIDC.getAccessToken();
            var tokenClaims = JSON.parse(OIDC.getIdTokenParts(id_token)[1]);
            var userInfoClaims = JSON.parse(OIDC.getUserInfo(access_token));
            var tokenClaimsHTMLString = JSONObjToHTMLTable(tokenClaims);
            var userInfoClaimsHTMLString = JSONObjToHTMLTable(access_token);
            OIDC.debug(true, id_token);

            function print_id_token(){
                document.getElementById("retrievedInfo").innerHTML = '<p> Id_token  </p>' + id_token +
                                                                '\n\n<p>  Access_token  </p>' +  access_token;
            }
        </script>
    </HEAD>

    <BODY onload="print_id_token();">
      <div class="container">
        <h1>Implicit Flow Test Callback</h1>

        <div id="retrievedInfo">
            id_token claims and userinfo not found.
        </div>
      </div>
    </BODY>
</HTML>
